[module/btdevice]
type = custom/script

interval = 5

exec-if = bluetoothctl info 2>&1 >/dev/null
exec = echo $(bluetoothctl info | grep Alias | cut -d' ' -f2-) \\($(upower --dump | grep -A 10 $(bluetoothctl info | grep Device | cut -d' ' -f2) | grep percentage | choose 1)\\)

format = <label>
label = %output%
